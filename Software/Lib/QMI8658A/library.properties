sentence=Library for the QMI8658A 6-axis IMU, built for the Waveshare ESP32-C6 Touch LCD 1.47 board with my custom pcb, based on the REV-A documentation sheet.
paragraph=This Lib Provides accelerometer, gyroscope and temperature readings / Any-Motion, No-Motion, Wake on Motion, pedometer, software reset, semi-auto offset calibration and optional FIFO support. INT2_EN is always kept in High-Z Mode and all interrupts use INT1.
